<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffdfd" />
    <meta name="description" content="Для Евочки — одно воспоминание, отсчёт до 5 ноября и маленький квест." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..800&amp;display=swap" rel="stylesheet" />
    <title>Для Евочки — 18</title>
    <script>
      try {
        const data = JSON.parse(localStorage.getItem('eva-quest:settings:v2') || '{}');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = data.theme === 'dark' || (data.theme === 'system' && systemDark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#251d2b' : '#fffdfd');
      } catch { /* Настройки не обязательны для работы сайта. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Невидимый элемент для сохранения прозрачности плавающей панели Safari 26.
         Это не цветная подложка и не занимает часть видимого контента. -->
    <div class="safari-toolbar-transparent-hint" aria-hidden="true"></div>
  </body>
</html>
