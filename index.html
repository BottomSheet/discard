<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffafa" />
    <meta name="description" content="Для Евочки — восемнадцать вопросов о наших маленьких и важных моментах." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..800&amp;display=swap" rel="stylesheet" />
    <title>Для Евочки — 18</title>
    <script>
      try {
        const data = JSON.parse(localStorage.getItem('eva-quest:settings:v2') || '{}');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = data.theme === 'dark' || (data.theme === 'system' && systemDark) ? 'dark' : 'light';
      } catch { /* Настройки не обязательны для работы сайта. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
